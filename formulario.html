<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Configuração Inteligente</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <main class="container">

    <form class="formulario">

      <h1>Configure sua experiência</h1>

      <label>
        Como é sua rotina de estudos?
      </label>

      <textarea placeholder="Ex: faculdade integral, cursinho, estágio..."></textarea>

      <label>
        Deseja organizar fotos por matérias?
      </label>

      <select>
        <option>Sim</option>
        <option>Não</option>
      </select>

      <label>
        Como deseja excluir imagens?
      </label>

      <select>
        <option>IA automática</option>
        <option>Manual</option>
      </select>

      <label>
        Defina importância dos conteúdos:
      </label>

      <div class="flex-opcoes">

        <div class="opcao">
          <input type="checkbox">
          <span>Provas</span>
        </div>

        <div class="opcao">
          <input type="checkbox">
          <span>Trabalhos</span>
        </div>

        <div class="opcao">
          <input type="checkbox">
          <span>Anotações rápidas</span>
        </div>

      </div>

      <a href="dashboard.html" class="botao">
        Finalizar
      </a>

    </form>

  </main>

</body>
</html>
