<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração Inteligente</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <header class="topo">
    <h1><img src="img/logo.png" alt="Focus"></h1>

    <nav>
      <a href="index.html">Voltar</a>
    </nav>
  </header>

  <main class="container">

    <form class="formulario">

      <h1>Configure sua experiência</h1>

      <label>
        Como é sua rotina de estudos?
      </label>

      <textarea placeholder="Ex: faculdade integral, cursinho, estágio..."></textarea>

      <label>
        Deseja organizar fotos por matérias?
      </label>

      <select title="Organizar por matérias">
        <option>Sim</option>
        <option>Não</option>
      </select>

      <label>
        Como deseja excluir imagens?
      </label>

      <select title="Excluir imagens">
        <option>IA automática</option>
        <option>Manual</option>
      </select>

      <label>
        Defina importância dos conteúdos:
      </label>

      <div class="flex-opcoes">

        <div class="opcao">
          <input type="checkbox" title="Provas">
          <span>Provas</span>
        </div>

        <div class="opcao">
          <input type="checkbox" title="Trabalhos">
          <span>Trabalhos</span>
        </div>

        <div class="opcao">
          <input type="checkbox" title="Anotações rápidas">
          <span>Anotações rápidas</span>
        </div>

      </div>

      <a href="dashboard.html" class="botao">
        Finalizar
      </a>

    </form>

  </main>

</body>
</html>
