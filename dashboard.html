<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel do Usuário</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <header class="topo">
    <h1>StudyCam</h1>

    <nav>
      <a href="#">Configurações</a>
    </nav>
  </header>

  <main class="dashboard">

    <section class="materias">

      <article class="card">
        <h2>Matemática</h2>

        <p>12 imagens organizadas</p>

        <p>Próxima prova: 15/05</p>

        <button>Abrir pasta</button>
      </article>

      <article class="card">
        <h2>Biologia</h2>

        <p>8 imagens organizadas</p>

        <p>IA encontrou conteúdo importante</p>

        <button>Abrir pasta</button>
      </article>

    </section>

    <section class="alertas">

      <article class="card-alerta">
        <h3>IA detectou duplicatas</h3>

        <p>
          6 imagens podem ser removidas automaticamente.
        </p>
      </article>

      <article class="card-alerta">
        <h3>Data importante encontrada</h3>

        <p>
          “Entrega do trabalho - sexta-feira”
        </p>
      </article>

    </section>

  </main>

</body>
</html>
